<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一張圖看完辦電影包場的通用流程：從起心動念、聯絡影城、算票價、收款宣傳，到活動當天。整理自影視雷達包場 SOP 指南。">
<meta property="og:title" content="包場流程總覽（通用版）｜影視雷達">
<meta property="og:description" content="一張圖看完辦電影包場的完整流程與每個岔路的選擇。">
<title>包場流程總覽（通用版）｜影視雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --bg:#EEF4F6; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#3B3F52; --muted:#5F6578; --line:#DCE4EA;
  --velvet:#E8708F; --velvet-ink:#FFFFFF; --velvet-soft:#FDE8EE; --velvet-deep:#B3456B;
  --sky:#8CC4DC; --sky-soft:#E4F2F8; --sky-deep:#2C6C8A;
  --warn:#B4521C; --warn-soft:#FFEADF; --ok:#4E9A62; --ok-soft:#E3F3E4;
  --band:#F8FAFBcc; --band-solid:#F9FBFC; --edge:#9AA6B6; --edge-hi:#E8708F; --shadow:#D5DFE6;
  --butter:#FFEDB5; --gold:#F2B84B; --screen:#2E3347; --screen-glow:#FFF4D6;
  --dotbg:radial-gradient(circle,#DDE8EE 1.4px,transparent 1.6px);
  --f-body:"Huninn","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B2130; --surface:#252D3F; --surface-2:#2C3549; --ink:#EDEFF6; --muted:#A3AABD; --line:#3A4459;
    --velvet:#F48CA8; --velvet-ink:#2A1520; --velvet-soft:#43293A; --velvet-deep:#F9B3C6;
    --sky:#6FA9C2; --sky-soft:#22384A; --sky-deep:#9AD0E8;
    --warn:#F5A677; --warn-soft:#442C22; --ok:#86CE96; --ok-soft:#24392C;
    --band:#212839cc; --band-solid:#232B3D; --edge:#66728A; --edge-hi:#F48CA8; --shadow:#131825;
    --butter:#F5DFA0; --gold:#F2C766; --screen:#10141F; --screen-glow:#3A3524;
    --dotbg:radial-gradient(circle,#26304A 1.4px,transparent 1.6px);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B2130; --surface:#252D3F; --surface-2:#2C3549; --ink:#EDEFF6; --muted:#A3AABD; --line:#3A4459;
  --velvet:#F48CA8; --velvet-ink:#2A1520; --velvet-soft:#43293A; --velvet-deep:#F9B3C6;
  --sky:#6FA9C2; --sky-soft:#22384A; --sky-deep:#9AD0E8;
  --warn:#F5A677; --warn-soft:#442C22; --ok:#86CE96; --ok-soft:#24392C;
  --band:#212839cc; --band-solid:#232B3D; --edge:#66728A; --edge-hi:#F48CA8; --shadow:#131825;
    --butter:#F5DFA0; --gold:#F2C766; --screen:#10141F; --screen-glow:#3A3524;
  --dotbg:radial-gradient(circle,#26304A 1.4px,transparent 1.6px);
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]){color-scheme:dark}}
body{margin:0;background:var(--bg);background-image:var(--dotbg);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;letter-spacing:.02em}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
b,strong{font-weight:400;color:var(--velvet-deep)}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 60px}

/* header */
.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end;margin-bottom:18px}
@media (max-width:760px){.masthead{grid-template-columns:1fr}}
.eyebrow{display:inline-block;font-size:12.5px;letter-spacing:.12em;color:var(--velvet-ink);background:var(--velvet);padding:2px 14px;border-radius:999px}
h1{font-size:clamp(34px,5vw,50px);line-height:1.2;margin-top:10px;letter-spacing:.06em}
.lede{color:var(--muted);max-width:38em;margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);background:var(--surface);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--shadow);max-width:480px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:14px;border-radius:6px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:18px 0 12px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:0;background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--shadow)}
.stages button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--velvet);color:var(--velvet-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:12px}
.stages button:hover{color:var(--velvet-deep)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 14px;font-size:13px}
.tbtn:hover{border-color:var(--velvet)}
.tbtn[aria-pressed="true"]{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink)}
.zoomv{font-family:var(--f-num);font-size:12.5px;color:var(--muted);min-width:44px;text-align:center}

/* diagram viewport */
.viewport{background:var(--surface);border-radius:28px;box-shadow:0 6px 0 var(--shadow);overflow:auto;padding:0;position:relative;-webkit-overflow-scrolling:touch}
.sizer{position:relative;margin:0 auto}
.canvas{position:absolute;left:0;top:0;width:1120px;padding:28px 28px 36px;transform-origin:0 0}
.canvas svg.edges{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
.edges path{fill:none;stroke:var(--edge);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.edges path.hi{stroke:var(--edge-hi);stroke-width:3.5}
.edges .ah{fill:var(--edge)}
.edges .ah-hi{fill:var(--edge-hi)}

/* stage bands */
.band{position:relative;border-radius:24px;background:var(--band);border:2.5px solid var(--line);padding:96px 20px 30px;margin-top:84px;scroll-margin-top:16px;box-shadow:0 5px 0 var(--line)}
.band:first-of-type{margin-top:0}
.band-h{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;font-size:22px;letter-spacing:.08em;color:var(--velvet-deep);background:var(--velvet-soft);border-radius:21px 21px 0 0;border-bottom:2.5px dashed var(--velvet);padding:14px 22px}
.band-h i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--velvet);color:var(--velvet-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:14px}
.flow{display:flex;flex-direction:column;align-items:center;gap:52px}

/* nodes */
.node{position:relative;z-index:2;border:0;text-align:center;text-wrap:balance;border-radius:18px;padding:10px 16px;line-height:1.5;transition:transform .15s,box-shadow .15s}
.node:hover{transform:translateY(-2px)}
.node.sel{box-shadow:0 0 0 4px var(--sky)!important}
.n-cap{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 28px;font-size:17px;box-shadow:0 4px 0 var(--shadow)}
.n-q{background:var(--velvet);color:var(--velvet-ink);font-size:16.5px;min-width:220px;max-width:320px;padding:12px 22px;box-shadow:0 4px 0 var(--velvet-deep)}
.n-q.sub{font-size:15px;min-width:180px;padding:10px 16px}
.n-leaf{background:var(--surface);border:2.5px solid var(--line);width:196px;font-size:14.5px;box-shadow:0 4px 0 var(--line)}
.n-leaf.warn{border-color:var(--warn);background:var(--warn-soft);box-shadow:0 4px 0 var(--warn-soft)}
.n-leaf:hover{border-color:var(--velvet)}
.n-step{background:var(--sky-soft);border:2.5px solid var(--sky);max-width:520px;padding:12px 18px;box-shadow:0 4px 0 var(--sky)}
.n-step .st{display:block;font-size:16px;color:var(--sky-deep)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chips span{font-size:13.5px;background:var(--surface);border-radius:999px;padding:1px 10px;color:var(--ink)}
.more{display:block;font-size:13px;color:var(--muted);margin-top:2px}
body:not(.detail) .more{display:none}
.n-leaf.warn .more{color:var(--warn)}

.blk{display:flex;flex-direction:column;align-items:center}
.brs{display:flex;justify-content:center;gap:18px;margin-top:40px;align-items:flex-start}
.br{display:flex;flex-direction:column;align-items:center;gap:12px}
.lab{position:relative;z-index:3;font-size:14px;background:var(--surface);color:var(--velvet-deep);border:2px solid var(--velvet-soft);border-radius:999px;padding:0 12px;white-space:nowrap}
.br .blk .brs{margin-top:34px;gap:12px}
.br .blk .n-leaf{width:170px}
.qnote{margin-top:14px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:6px 14px;max-width:560px;text-align:center;position:relative;z-index:2}
.qnote::before{content:"補充";display:inline-block;background:var(--sky);color:#fff;font-size:11px;padding:0 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.wchip{display:block;margin-top:6px;font-size:12px;background:var(--surface);color:var(--warn);border-radius:999px;padding:0 10px}

.cases{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cases .n-leaf{width:auto}

/* detail drawer */
.drawer{position:fixed;z-index:20;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100vw - 32px));background:var(--surface);border-radius:24px;box-shadow:0 8px 0 var(--shadow),0 20px 50px #0002;padding:22px 22px 20px;overflow:auto;transform:translateX(calc(100% + 32px));transition:transform .35s cubic-bezier(.22,1,.36,1)}
.drawer.open{transform:none}
@media (max-width:640px){
  .drawer{left:12px;right:12px;width:auto;top:auto;max-height:70vh;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateY(calc(100% + 24px))}
}
.drawer .x{position:absolute;z-index:3;right:14px;top:14px;border:0;width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:18px;line-height:1}
.drawer .x:hover{background:var(--velvet-soft)}
.dpill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--velvet-deep);background:var(--velvet-soft);padding:2px 12px 2px 4px;border-radius:999px}
.dpill i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--velvet);color:var(--velvet-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:12px}
.drawer h2{font-size:22px;line-height:1.45;margin:10px 40px 10px 0}
.drawer .kind{font-size:12px;color:var(--muted)}
.drawer p{margin:0 0 10px}
.drawer ul{margin:0 0 12px;padding-left:1.2em}
.drawer li{margin:3px 0}
.drawer .dopt{background:var(--surface-2);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.drawer .dopt b{display:block}
.drawer .dopt span{font-size:13.5px;color:var(--muted)}
.drawer table{width:100%;border-collapse:collapse;font-size:13px}
.drawer td{font-size:13.5px;padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
.drawer td:first-child{white-space:nowrap;padding-right:10px}
.drawer .todo{background:var(--ok-soft);border-radius:16px;padding:10px 14px}
.drawer .todo h3{font-size:13px;color:var(--ok);margin-bottom:2px}
.hint{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:center}
.src{margin-top:34px;font-size:12.5px;color:var(--muted);border-top:2px dashed var(--line);padding-top:16px}

/* ---------- cinema touches ---------- */
/* curtain valance across the top */
.valance{height:34px;background:
  radial-gradient(circle at 50% 0,var(--velvet) 17px,transparent 18px) 0 0/44px 34px repeat-x,
  linear-gradient(var(--velvet),var(--velvet)) 0 0/100% 10px no-repeat;position:relative}
.valance::after{content:"";position:absolute;left:0;right:0;top:4px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 14px);opacity:.8;border-radius:2px}
.hero-art{width:min(300px,100%);height:auto;display:block;margin:0 auto 10px}
.hero-art .ink{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.side{display:flex;flex-direction:column;align-items:center}
.eyebrow::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--velvet-ink);margin-right:6px;vertical-align:0;box-shadow:inset 0 0 0 3px var(--velvet)}

/* film reel badge */
.reel{display:inline-block;flex:none;width:34px;height:34px;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,var(--band-solid) 2.6px,transparent 3px),
  radial-gradient(circle at 50% 23%,var(--band-solid) 3.4px,transparent 3.8px),
  radial-gradient(circle at 76% 42%,var(--band-solid) 3.4px,transparent 3.8px),
  radial-gradient(circle at 66% 73%,var(--band-solid) 3.4px,transparent 3.8px),
  radial-gradient(circle at 34% 73%,var(--band-solid) 3.4px,transparent 3.8px),
  radial-gradient(circle at 24% 42%,var(--band-solid) 3.4px,transparent 3.8px),var(--velvet);
  box-shadow:0 3px 0 var(--velvet-deep)}
.scene{font-family:var(--f-num);font-weight:800;font-size:12.5px;letter-spacing:.14em;color:var(--velvet-ink);background:var(--velvet);border-radius:999px;padding:2px 12px}

/* sprocket holes on each band edge */
.band::before,.band::after{content:"";position:absolute;top:100px;bottom:22px;width:10px;
  background:radial-gradient(closest-side,var(--line) 88%,transparent) 0 0/10px 22px repeat-y;opacity:.9}
.band::before{left:10px}.band::after{right:10px}
@media (max-width:640px){.band::before,.band::after{display:none}}

/* start = admission ticket */
#n-start{background:var(--velvet);color:var(--velvet-ink);border-radius:16px;padding:12px 38px 12px 54px;font-size:18px;box-shadow:0 4px 0 var(--velvet-deep);overflow:visible}
#n-start::before,#n-start::after{content:"";position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
#n-start::before{left:-10px}#n-start::after{right:-10px}
#n-start .stub{position:absolute;left:12px;top:8px;bottom:8px;width:26px;border-right:2.5px dashed #ffffff99;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:9px;letter-spacing:.1em;writing-mode:vertical-rl;opacity:.9}

/* end = the big screen */
.screen-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#n-end{background:radial-gradient(ellipse at 50% 40%,var(--screen-glow),transparent 70%),var(--screen);color:#FFF7E0;border-radius:22px;padding:30px 70px;font-size:19px;min-width:420px;box-shadow:0 5px 0 var(--shadow),0 0 0 6px var(--ink);overflow:hidden}
#n-end::before,#n-end::after{content:"";position:absolute;top:0;bottom:0;width:48px;background:
  repeating-linear-gradient(90deg,#ffffff22 0 4px,transparent 4px 12px),var(--velvet);}
#n-end::before{left:0;border-radius:0 0 40px 0}
#n-end::after{right:0;border-radius:0 0 0 40px}
#n-end .lamp{display:block;font-size:12px;letter-spacing:.2em;opacity:.75;margin-bottom:2px}
.seats{width:min(480px,100%);height:26px;background:radial-gradient(circle at 50% 100%,var(--velvet-soft) 11px,transparent 12px) 0 0/30px 26px repeat-x;position:relative}
.seats::after{content:"";position:absolute;left:15px;right:15px;top:10px;height:26px;background:radial-gradient(circle at 50% 100%,var(--line) 11px,transparent 12px) 0 0/30px 26px repeat-x}

/* must-do step = ticket with side notches */
.n-step::before,.n-step::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--band-solid);border:2.5px solid var(--sky);transform:translateY(-50%)}
.n-step::before{left:-11px;clip-path:inset(0 0 0 50%)}
.n-step::after{right:-11px;clip-path:inset(0 50% 0 0)}
.n-step .st::before{content:"";display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0;background:
  radial-gradient(circle at 0 50%,var(--sky-soft) 3px,transparent 3.5px),radial-gradient(circle at 100% 50%,var(--sky-soft) 3px,transparent 3.5px),var(--sky-deep)}

/* decision = clapper-top stripe */
.n-q::before{content:"";position:absolute;left:14px;right:14px;top:-7px;height:7px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(-55deg,var(--ink) 0 7px,var(--surface) 7px 14px);opacity:.9}
.n-q.sub::before{left:18px;right:18px}

/* NG takes */
.ng{display:inline-block;font-family:var(--f-num);font-weight:800;font-size:10.5px;letter-spacing:.08em;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.clap{display:inline-block;width:26px;height:22px;flex:none}

/* drawer as a ticket */
.drawer .dhead{margin:-22px -22px 14px;padding:20px 22px 16px;background:var(--velvet-soft);border-radius:24px 24px 0 0;position:relative;border-bottom:2.5px dashed var(--velvet)}
.drawer .dhead::before,.drawer .dhead::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.drawer .dhead::before{left:-10px}.drawer .dhead::after{right:-10px}
.drawer .dhead h2{margin-bottom:2px}

/* end credits */
.credits{margin-top:40px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:4px;justify-items:center}
.credits .ct{font-family:var(--f-num);font-weight:800;letter-spacing:.3em;font-size:12px;color:var(--velvet);margin-bottom:6px}
.credits dl{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin:0;text-align:left}
.credits dt{text-align:right;color:var(--muted)}
.credits dd{margin:0;color:var(--ink);max-width:30em}
.credits .fin{margin-top:14px;font-family:var(--f-num);font-weight:800;letter-spacing:.4em;color:var(--ink)}
@media (max-width:640px){#n-end{min-width:0;padding:26px 58px}}
/* ---------- mobile: vertical card layout, no zoom ---------- */
@media (max-width:760px){
  .wrap{padding-inline:16px;padding-block:14px 48px}
  h1{font-size:32px}
  .hero-art{width:220px}
  .legend{max-width:none;padding:10px 12px;gap:6px 12px}
  .bar{margin:14px 0 10px}
  .stages{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none;width:calc(100% + 32px)}
  .stages::-webkit-scrollbar{display:none}
  .stages button{flex:none}
  .tools #zoomOut,.tools #zoomIn,.tools #zoomFit,.tools .zoomv{display:none}
  .viewport{overflow:visible;background:none;box-shadow:none;border-radius:0}
  .sizer{width:auto!important;height:auto!important}
  .canvas{position:static;width:auto;padding:0;transform:none!important}
  .canvas svg.edges{display:none}
  .band{padding:80px 12px 18px;margin-top:56px;scroll-margin-top:12px}
  .band-h{font-size:18px;gap:10px;padding:12px 14px}
  .reel{width:30px;height:30px}
  .band .flow{align-items:stretch;gap:24px;background:linear-gradient(var(--edge),var(--edge)) 50% 0/2.5px 100% no-repeat}
  .blk{width:100%}
  .n-q,.n-q.sub{min-width:0;max-width:100%;width:100%}
  .n-step{max-width:none;width:100%}
  .brs,.br .blk .brs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;width:100%;background:var(--band-solid);border-radius:18px;padding:12px 10px 10px;border:2px solid var(--line)}
  .br{gap:6px;align-items:stretch}
  .br.wide,.brs>.br:last-child:nth-child(odd){grid-column:1/-1}
  .br.wide .blk .brs{background:var(--surface);margin-top:12px}
  .lab{white-space:normal;text-align:center;align-self:center}
  .n-leaf,.br .blk .n-leaf{width:100%;height:100%;padding:8px 10px;font-size:14px}
  .qnote{max-width:none;margin-top:10px}
  .cases{grid-template-columns:1fr 1fr;gap:10px}
  #n-start{align-self:center}

   detail:'<p>付清尾款後，向影城確認何時可以領票，實體票弄丟會非常麻煩。官方特典通常會先寄到影城，記得向窗口領取。有自製應援物的話，也要留意物流時間。</p><p>行前信必備：</p><ul><li>報到識別碼：專屬序號或手機末幾碼</li><li>影城完整名稱與地址（連鎖影城分館多，容易跑錯）</li><li>遲到條款：開演後保留幾分鐘</li><li>當天流程：報到時間、報到位置，抽獎合照排在映前還是映後</li></ul>'},
 ]},
 {k:'day',n:'6',name:'活動當天',items:[
  {t:'step',id:'checkin',text:'提前到場報到',chips:['找朋友幫忙','擺好票券與特典','核對報到識別碼','留人等遲到者'],
   detail:'<p>建議提前約 1 小時到場。找幾位朋友幫忙報到、發票與特典、攝影紀錄。部分影城會協助準備報到桌或立牌，事先問清楚。</p><p>用電子或紙本名單都可以，能快速核對身分就好。開演前留一兩位在報到處等遲到的人。</p>'},
  {t:'q',id:'lottery',text:'映前映後要抽獎嗎？',detail:'<p>影城給的映前映後時間通常<strong>很短</strong>，合照、抽獎、致詞都擠在這裡，要事先確認可用時間並安排好順序。</p>',opts:[
    {label:'線上工具',out:'快速、公開透明',detail:'<p>最省時間。記得事先測好投影或手機畫面。</p>'},
    {label:'紙本抽獎券',out:'較花時間、臨場感強',detail:'<p>紙本抽獎通常花更多時間，但現場氣氛更熱烈。</p>'},
    {label:'不抽',out:'時間留給合照致詞',detail:'<p>時間有限，少一個環節反而從容。</p>'},
  ]},
  {t:'step',id:'after',text:'散場與收尾',chips:['提醒隨身物品','巡視遺失物','寄感謝信與大合照'],
   detail:'<p>趁大家心還熱著的時候寄信給參與者，分享大合照與簡短心得，約好未來再見。</p>'},
 ]},
];
const CASES=[
 {id:'c1',out:'特典品相或數量爭議',detail:'<p>報到尖峰時有人要求更換特典，或特典不夠發。</p><p><strong>解法：</strong>在宣傳文案或行前信寫明特典瑕疵的處理方式（例如一律散場後處理）、數量有限無法更換等規則。</p>'},
 {id:'c2',out:'現場遺失物品',detail:'<p>票根、應援物或個人物品在現場遺失。</p><p><strong>解法：</strong>報到處設為失物集中點，散場前廣播或在群組公告，必要時依座位號碼協助找回失主。</p>'},
 {id:'c3',out:'場地或設備出狀況',detail:'<p>放映、音響、空調等設備故障，可能導致活動延誤或無法進行。</p><p><strong>解法：</strong>事先和影城確認異常時的處理方式，想好要退票還是改期，以及怎麼通知陸續到場的參與者。</p>'},
 {id:'c4',out:'非參與者闖入',detail:'<p>沒報名的人趁亂進場或要求參與活動。</p><p><strong>解法：</strong>堅定說明活動只屬於付費參與者，安排多位工作人員一起處理，必要時請影城人員協助。</p>'},
];

/* ---------- render ---------- */
const D={}, EDGES=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderQ(q,stage,sub){
  D[q.id]={kind:'要做的決定',title:q.text,stage,html:q.detail+q.opts.map(o=>`<div class="dopt"><b>${esc(o.label)}</b><span>${esc(o.sub?o.sub.text:o.out)}</span></div>`).join('')};
  let exits=[];
  const brs=q.opts.map((o,i)=>{
    let inner;
    if(o.sub){const r=renderQ(o.sub,stage,true);inner=r.html;EDGES.push({from:q.id,to:o.sub.id,split:true});exits.push(...r.exits);}
    else{
      const id=q.id+'-'+i;
      D[id]={kind:'選了「'+o.label+'」',title:o.out,stage,html:o.detail+(o.todo?`<div class="todo"><h3>記得做</h3><ul>${o.todo.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:'')};
      inner=`<button class="node n-leaf${o.warn?' warn':''}" id="n-${id}" data-id="${id}">${esc(o.out)}${o.more?`<span class="more">${esc(o.more)}</span>`:''}</button>`;
      EDGES.push({from:q.id,to:id,split:true});exits.push(id);
    }
    return `<div class="br${o.sub?' wide':''}"><span class="lab">${esc(o.label)}</span>${inner}</div>`;
  }).join('');
  const html=`<div class="blk"><button class="node n-q${sub?' sub':''}" id="n-${q.id}" data-id="${q.id}">${esc(q.text)}${q.warnChip?`<span class="wchip">${esc(q.warnChip)}</span>`:''}</button><div class="brs">${brs}</div>${q.note?`<div class="qnote">${esc(q.note)}</div>`:''}</div>`;
  return {html,exits};
}
function render(){
  let prev=['start'], html='';
  D.start={kind:'起點',title:'好想包場！',stage:null,html:'<p>「這部電影，絕對不能只有我自己看。」包場的衝動是最重要的第一步。</p><p>從起心動念到把大家邀進影廳，中間有 6 個階段。這張圖把每個階段要做的事和會遇到的岔路都攤開來。</p>'};
  html+=`<div class="flow" style="margin-bottom:40px"><button class="node" id="n-start" data-id="start"><span class="stub">ADMIT</span>好想包場！</button></div>`;
  FLOW.forEach(st=>{
    let inner='';
    st.items.forEach(it=>{
      if(it.t==='q'){const r=renderQ(it,st);prev.forEach(p=>EDGES.push({from:p,to:it.id}));prev=r.exits;inner+=r.html;}
      else{
        D[it.id]={kind:'必做步驟',title:it.text,stage:st,html:it.detail};
        inner+=`<button class="node n-step" id="n-${it.id}" data-id="${it.id}"><span class="st">${esc(it.text)}</span><span class="chips">${it.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</span></button>`;
        prev.forEach(p=>EDGES.push({from:p,to:it.id}));prev=[it.id];
      }
    });
    html+=`<section class="band" id="band-${st.k}"><div class="band-h"><span class="reel" aria-hidden="true"></span><span class="scene">SCENE ${String(st.n).padStart(2,'0')}</span>${st.name}</div><div class="flow">${inner}</div></section>`;
  });
  D.end={kind:'終點',title:'燈光暗下，一起同步共鳴',stage:null,html:'<p>包場，是一群人的愛在同一個時空裡高度凝聚。願意扛下金錢風險、售票壓力和突發狀況，都是為了燈光暗下的那一刻。</p>'};
  html+=`<div class="flow" style="margin-top:40px"><div class="screen-wrap"><button class="node" id="n-end" data-id="end"><span class="lamp">NOW SHOWING</span>燈光暗下，一起同步共鳴</button><div class="seats" aria-hidden="true"></div></div></div>`;
  prev.forEach(p=>EDGES.push({from:p,to:'end'}));
  const ex={k:'extra',n:'＋',name:'突發狀況'};
  CASES.forEach(c=>D[c.id]={kind:'突發狀況',title:c.out,stage:ex,html:c.detail});
  html+=`<section class="band" id="band-extra"><div class="band-h"><svg class="clap" viewBox="0 0 26 22" aria-hidden="true"><rect x="2" y="9" width="22" height="12" rx="3" fill="var(--ink)"/><g transform="rotate(-14 2 8)"><rect x="2" y="3" width="22" height="5.5" rx="2" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"/><path d="M7 3l-2 5.5M12 3l-2 5.5M17 3l-2 5.5M22 3l-2 5.5" stroke="var(--ink)" stroke-width="2"/></g></svg><span class="scene">NG</span>突發狀況：SOP 之外，先想好怎麼接</div><div class="cases">${CASES.map(c=>`<button class="node n-leaf warn" id="n-${c.id}" data-id="${c.id}"><span class="ng">NG ${c.id.slice(1)}</span>${esc(c.out)}</button>`).join('')}</div></section>`;
  const cv=document.getElementById('canvas');
  cv.innerHTML=`<svg class="edges" id="edges"></svg>`+html;
  document.getElementById('stages').innerHTML=[...FLOW,ex].map(s=>`<button data-band="${s.k}"><i>${s.n}</i>${s.name}</button>`).join('');
}

/* ---------- edges ---------- */
let scale=1;
function box(id){
  const el=document.getElementById('n-'+id), cv=document.getElementById('canvas');
  const r=el.getBoundingClientRect(), c=cv.getBoundingClientRect();
  const x=(r.left-c.left)/scale, y=(r.top-c.top)/scale, w=r.width/scale, h=r.height/scale;
  return {cx:x+w/2,top:y,bottom:y+h};
}
function elbow(x1,y1,x2,y2,my){
  if(Math.abs(x1-x2)<1)return `M${x1} ${y1}V${y2}`;
  const r=Math.min(12,Math.abs(x2-x1)/2,Math.abs(my-y1),Math.abs(y2-my)), d=x2>x1?1:-1;
  return `M${x1} ${y1}V${my-r}Q${x1} ${my} ${x1+d*r} ${my}H${x2-d*r}Q${x2} ${my} ${x2} ${my+r}V${y2}`;
}
const mq=matchMedia('(max-width:760px)');
function draw(){
  if(mq.matches){document.getElementById('edges').innerHTML='';return;}
  const cv=document.getElementById('canvas'), svg=document.getElementById('edges');
  const W=cv.offsetWidth, H=cv.offsetHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let out=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M1 1L9 5L1 9z"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-hi" d="M1 1L9 5L1 9z"/></marker></defs>`;
  EDGES.forEach(e=>{
    const a=box(e.from), b=box(e.to);
    const y2=b.top-3;
    let my=e.split?a.bottom+18:y2-22;
    const tb=document.getElementById('n-'+e.to).closest('.band');
    if(tb&&tb!==document.getElementById('n-'+e.from).closest('.band'))my=(tb.getBoundingClientRect().top-cv.getBoundingClientRect().top)/scale-42;
    out+=`<path d="${elbow(a.cx,a.bottom+2,b.cx,y2,my)}" data-from="${e.from}" data-to="${e.to}" marker-end="url(#ah)"/>`;
  });
  svg.innerHTML=out;
  sizeUp();
}
function sizeUp(){
  const cv=document.getElementById('canvas'), sz=document.getElementById('sizer');
  cv.style.transform=`scale(${scale})`;
  sz.style.width=cv.offsetWidth*scale+'px';sz.style.height=cv.offsetHeight*scale+'px';
  document.getElementById('zoomV').textContent=Math.round(scale*100)+'%';
}
function fitScale(){const vw=document.getElementById('viewport').clientWidth, cw=document.getElementById('canvas').offsetWidth;return Math.min(1,vw/cw);}
function setScale(s){scale=Math.max(.35,Math.min(1.2,s));sizeUp();}

/* ---------- interaction ---------- */
function light(id,on){
  document.querySelectorAll(`#edges path[data-to="${id}"],#edges path[data-from="${id}"]`).forEach(p=>{
    p.classList.toggle('hi',on);p.setAttribute('marker-end',on?'url(#ahh)':'url(#ah)');
  });
}
function openD(id){
  const d=D[id];if(!d)return;
  document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));
  document.getElementById('n-'+id).classList.add('sel');
  document.getElementById('dbody').innerHTML=`<div class="dhead">${d.stage?`<span class="dpill"><i>${d.stage.n}</i>${d.stage.name}</span>`:''}<h2>${esc(d.title)}</h2><div class="kind">${esc(d.kind)}</div></div><div>${d.html}</div>`;
  document.getElementById('drawer').classList.add('open');
}
function closeD(){document.getElementById('drawer').classList.remove('open');document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!t){if(!e.target.closest('.drawer'))closeD();return;}
  if(t.dataset.id){openD(t.dataset.id);return;}
  if(t.dataset.band){document.getElementById('band-'+t.dataset.band).scrollIntoView({behavior:'smooth',block:'start',inline:'center'});return;}
  switch(t.id){
    case 'closeD':closeD();break;
    case 'zoomIn':setScale(scale+.1);break;
    case 'zoomOut':setScale(scale-.1);break;
    case 'zoomFit':setScale(fitScale());break;
    case 'detailBtn':{const on=!document.body.classList.contains('detail');document.body.classList.toggle('detail',on);t.setAttribute('aria-pressed',on);t.textContent=on?'隱藏補充說明':'顯示補充說明';draw();break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
document.addEventListener('pointerover',e=>{const n=e.target.closest('.node');if(n)light(n.dataset.id,true);});
document.addEventListener('pointerout',e=>{const n=e.target.closest('.node');if(n)light(n.dataset.id,false);});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!mq.matches)draw();},150);});

render();
function boot(){scale=1;draw();if(mq.matches)return;const f=fitScale();setScale(f<.62?.62:f);}
boot();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot);
mq.addEventListener('change',boot);
</script>
</body>
